<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>粉粉打卡 · 工作台</title>
<!-- PWA Meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="粉粉打卡">
<meta name="theme-color" content="#ffe3ee">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="https://thub007.github.io/oe/icon-180.png">

<link rel="apple-touch-icon" sizes="152x152" href="https://thub007.github.io/oe/icon-180.png">
<link rel="apple-touch-icon" sizes="120x120" href="https://thub007.github.io/oe/icon-180.png">
<link rel="icon" sizes="192x192" href="https://thub007.github.io/oe/icon-192.png">
<link rel="icon" sizes="512x512" href="https://thub007.github.io/oe/icon-512.png">
<!-- PWA 离线缓存 Service Worker 注册 -->
<style>
/* ========== 设计变量：马卡龙粉色系 ========== */
:root{
  --pink-50:#fff5f8;
  --pink-100:#ffe8f0;
  --pink-150:#ffdce8;
  --pink-200:#ffc9dd;
  --pink-300:#ffa9c9;
  --pink-400:#ff8ab5;
  --pink-500:#ff6fa6;
  --pink-600:#f0568f;
  --pink-700:#d63d77;
  --cream:#fff9fb;
  --lilac:#f0e6ff;
  --lilac-2:#d9c5ff;
  --mint:#d4f5ea;
  --lemon:#fff4d4;
  --peach:#ffe0d4;
  --sky:#d4ecff;
  --text-main:#7a4a5c;
  --text-soft:#b07a8c;
  --text-faint:#d4a8b8;
  --shadow-pink:0 8px 24px rgba(255,111,166,.18);
  --shadow-soft:0 4px 14px rgba(255,150,180,.12);
  --shadow-card:0 6px 20px rgba(220,120,150,.10);
  --radius:20px;
  --radius-lg:28px;
  --radius-sm:14px;
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#ffe3ee 0%,#ffd0e2 40%,#f5e6ff 100%);
  color:var(--text-main);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* 背景装饰气泡 */
body::before,body::after{
  content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;
}
body::before{
  width:340px;height:340px;background:radial-gradient(circle,#ffd0e2 0%,transparent 70%);
  top:-80px;right:-80px;opacity:.6;
}
body::after{
  width:280px;height:280px;background:radial-gradient(circle,#e8d5ff 0%,transparent 70%);
  bottom:-60px;left:-60px;opacity:.55;
}

/* ========== 手机外壳 ========== */
.phone{
  position:relative;z-index:1;
  width:420px;height:860px;max-height:96vh;
  background:var(--cream);
  border-radius:46px;
  box-shadow:0 30px 70px rgba(214,61,119,.28),0 0 0 12px #fff,0 0 0 13px var(--pink-200);
  display:flex;overflow:hidden;
}
@media(max-height:880px){
  .phone{height:96vh;}
}

/* 顶部刘海 */
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:26px;background:#fff;border-radius:0 0 18px 18px;z-index:50;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.notch::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--pink-200);}
.notch::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--pink-150);position:absolute;left:24px;}

/* ========== 左侧导航栏 ========== */
.sidebar{
  width:96px;background:linear-gradient(180deg,#fff 0%,var(--pink-50) 100%);
  border-right:1.5px dashed var(--pink-150);
  display:flex;flex-direction:column;align-items:center;
  padding:48px 0 16px;gap:10px;flex-shrink:0;
  position:relative;
}
.sidebar-title{
  font-size:11px;color:var(--text-faint);letter-spacing:2px;
  writing-mode:vertical-rl;margin-bottom:8px;font-weight:600;
}
.nav-item{
  width:78px;padding:12px 6px;border-radius:var(--radius-sm);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;transition:all .25s cubic-bezier(.34,1.56,.64,1);
  user-select:none;position:relative;background:transparent;border:none;
  font-family:inherit;
}
.nav-item:hover{background:var(--pink-50);transform:translateY(-1px);}
.nav-item.active::after{
  content:"";position:absolute;right:-11px;top:50%;transform:translateY(-50%);
  width:0;height:0;border-style:solid;border-width:5px 0 5px 6px;
  border-color:transparent transparent transparent var(--pink-500);
  z-index:6;
}
.nav-item.active{background:linear-gradient(135deg,var(--pink-300),var(--pink-400));box-shadow:var(--shadow-pink);}
.nav-item.active .nav-icon{background:rgba(255,255,255,.35);}
.nav-item.active .nav-label{color:#fff;}
.nav-icon{
  width:42px;height:42px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  font-size:22px;box-shadow:var(--shadow-soft);transition:all .25s;
}
.nav-item.dragging{opacity:.4;transform:scale(.92);}
.nav-item.drag-over{background:var(--pink-100);}
.nav-label{font-size:11px;color:var(--text-soft);font-weight:600;}
.drag-handle{
  position:absolute;top:3px;right:5px;font-size:9px;color:var(--text-faint);
  opacity:.45;transition:opacity .2s;letter-spacing:-1px;
}
.nav-item:hover .drag-handle{opacity:.7;}

.sidebar-footer{
  margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.sidebar-tip{
  writing-mode:vertical-rl;font-size:9px;color:var(--text-faint);
  opacity:.5;letter-spacing:1px;margin-bottom:4px;font-weight:600;
}
.sync-badge{
  display:flex;align-items:center;gap:4px;font-size:9px;font-weight:700;
  padding:4px 8px;border-radius:20px;
}
.sync-on{background:var(--mint);color:#3aa884;}
.sync-off{background:#f0f0f0;color:#aaa;}

/* ========== 主内容区 ========== */
.main{
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:52px 18px 24px;position:relative;
}
.main::-webkit-scrollbar{width:0;}

.page-header{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;
}
.page-title{
  font-size:24px;font-weight:800;color:var(--pink-600);
  display:flex;align-items:center;gap:8px;
}
.page-title .emoji{font-size:26px;}
.page-date{font-size:12px;color:var(--text-soft);background:var(--pink-100);padding:5px 12px;border-radius:20px;font-weight:600;}

/* ========== 每日打卡 ========== */
.progress-card{
  background:linear-gradient(135deg,#fff 0%,var(--pink-50) 100%);
  border-radius:var(--radius-lg);padding:22px 20px;margin-bottom:18px;
  box-shadow:var(--shadow-card);position:relative;overflow:hidden;
}
.progress-card::before{
  content:"";position:absolute;top:-30px;right:-30px;width:120px;height:120px;
  background:radial-gradient(circle,var(--pink-100) 0%,transparent 70%);
}
.progress-top{display:flex;align-items:center;gap:16px;position:relative;}
.progress-ring{width:88px;height:88px;flex-shrink:0;position:relative;}
.progress-ring svg{transform:rotate(-90deg);}
.progress-ring-text{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
.progress-ring-text .num{font-size:24px;font-weight:800;color:var(--pink-600);line-height:1;}
.progress-ring-text .unit{font-size:10px;color:var(--text-soft);margin-top:2px;}
.progress-info{flex:1;}
.progress-info .label{font-size:12px;color:var(--text-soft);margin-bottom:4px;}
.progress-info .desc{font-size:15px;font-weight:700;color:var(--text-main);line-height:1.4;}
.progress-info .cheer{font-size:11px;color:var(--pink-400);margin-top:6px;font-weight:600;}

.add-bar{
  display:flex;gap:8px;margin-bottom:16px;
}
.add-input{
  flex:1;border:2px solid var(--pink-150);border-radius:var(--radius);
  padding:12px 16px;font-size:14px;background:#fff;color:var(--text-main);
  font-family:inherit;outline:none;transition:all .2s;
}
.add-input::placeholder{color:var(--text-faint);}
.add-input:focus{border-color:var(--pink-300);box-shadow:0 0 0 4px var(--pink-100);}
.add-btn{
  width:46px;height:46px;border:none;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--pink-400),var(--pink-500));
  color:#fff;font-size:24px;cursor:pointer;box-shadow:var(--shadow-pink);
  display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;
}
.add-btn:hover{transform:scale(1.05);}
.add-btn:active{transform:scale(.95);}

.check-list{display:flex;flex-direction:column;gap:10px;}
.check-item{
  display:flex;align-items:center;gap:12px;padding:14px 16px;
  background:#fff;border-radius:var(--radius);box-shadow:var(--shadow-soft);
  transition:all .25s;position:relative;
}
.check-item.done{background:linear-gradient(135deg,var(--mint) 0%,#fff 100%);}
.check-item.done .item-name{color:var(--text-faint);text-decoration:line-through;}
.check-circle{
  width:30px;height:30px;border-radius:50%;border:2.5px solid var(--pink-200);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);background:#fff;
}
.check-circle.checked{background:linear-gradient(135deg,var(--pink-400),var(--pink-500));border-color:var(--pink-500);}
/* 表格小图标 */
.check-circle .ck{
  display:inline-flex;align-items:center;justify-content:center;
  width:100%;height:100%;font-size:0;
}
.check-circle .ck::after{
  content:"";display:block;width:8px;height:4px;
  border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;
  transform:rotate(-45deg);margin-top:-3px;
}
.cal-detail-title{
  font-size:14px;font-weight:700;color:var(--pink-600);margin-bottom:10px;display:flex;align-items:center;gap:8px;
}
.cal-detail-title::before{
  content:"";display:inline-block;width:10px;height:10px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-300),var(--pink-500));
}
.cal-detail-item{
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-main);
  padding:8px 12px;background:var(--pink-50);border-radius:12px;
}
.cal-detail-item::before{
  content:"";width:14px;height:14px;border-radius:50%;
  background:var(--pink-300);flex-shrink:0;
  background-image:radial-gradient(circle at 30% 30%,#fff 0%,transparent 40%);
}
.check-circle.checked .ck{opacity:1;transform:scale(1);}
.item-name{flex:1;font-size:15px;font-weight:600;color:var(--text-main);outline:none;}
.item-name[contenteditable=true]:focus{background:var(--pink-50);border-radius:6px;padding:2px 6px;margin:-2px -6px;}
.item-time{font-size:11px;color:var(--text-faint);}
.item-del{
  width:28px;height:28px;border-radius:50%;border:none;background:transparent;
  color:var(--text-faint);cursor:pointer;font-size:15px;opacity:0;transition:all .2s;
  display:flex;align-items:center;justify-content:center;
}
.check-item:hover .item-del{opacity:.7;}
.item-del:hover{background:var(--pink-100);color:var(--pink-500);opacity:1!important;}

/* 同步状态美化 */
.sync-badge{
  display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
  padding:5px 10px;border-radius:20px;border:1.5px solid transparent;
}
.sync-badge svg{width:8px;height:8px;}
.sync-on{background:var(--mint);color:#3aa884;border-color:#a8e6d0;}
.sync-off{background:#f0f0f0;color:#999;border-color:#e0e0e0;}

.empty-state{
  text-align:center;padding:48px 20px 20px;color:var(--text-faint);
}
.empty-state .emoji{
  display:inline-flex;align-items:center;justify-content:center;
  width:84px;height:84px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-100),var(--pink-150));
  margin-bottom:14px;box-shadow:var(--shadow-soft);
}
.empty-state .emoji svg{width:40px;height:40px;color:var(--pink-500);}
.empty-state .text{font-size:13px;line-height:1.6;}

/* 删除按钮美化 */
.item-del{
  width:30px;height:30px;border-radius:50%;border:none;background:transparent;
  color:var(--text-faint);cursor:pointer;opacity:0;transition:all .2s;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.item-del svg{width:14px;height:14px;}

/* ========== 日历打卡 ========== */
.cal-stats{
  display:flex;gap:10px;margin-bottom:16px;
}
.stat-card{
  flex:1;background:linear-gradient(135deg,#fff,var(--pink-50));
  border-radius:var(--radius);padding:14px 12px;text-align:center;
  box-shadow:var(--shadow-soft);
}
.stat-card .stat-num{font-size:24px;font-weight:800;color:var(--pink-600);line-height:1;}
.stat-card .stat-label{font-size:11px;color:var(--text-soft);margin-top:4px;}
.stat-card.alt{background:linear-gradient(135deg,#fff,var(--lilac));}
.stat-card.alt .stat-num{color:#9b6fd9;}

.cal-card{
  background:linear-gradient(180deg,#fff 0%,var(--pink-50) 100%);
  border-radius:var(--radius-lg);padding:18px 16px;box-shadow:var(--shadow-card);
}
.cal-head{
  display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
}
.cal-month{font-size:18px;font-weight:800;color:var(--pink-600);}
.cal-nav{
  width:34px;height:34px;border-radius:50%;border:none;background:var(--pink-100);
  color:var(--pink-600);cursor:pointer;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.cal-nav:hover{background:var(--pink-200);}
.cal-nav:active{transform:scale(.9);}
.cal-week{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;
}
.cal-week span{
  text-align:center;font-size:11px;font-weight:700;color:var(--text-soft);padding:4px 0;
}
.cal-days{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;
}
.cal-day{
  aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:13px;font-weight:600;
  color:var(--text-main);position:relative;cursor:pointer;transition:all .2s;
  background:transparent;
}
.cal-day:hover{background:var(--pink-100);}
.cal-day.other-month{color:var(--text-faint);opacity:.4;}
.cal-day.today{background:var(--pink-150);color:var(--pink-700);font-weight:800;}
.cal-day.today::after{
  content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--pink-500);
}
.cal-day.has-check{
  background:linear-gradient(135deg,var(--pink-300),var(--pink-400));color:#fff;
  box-shadow:0 3px 8px rgba(255,111,166,.3);
}
.cal-day.has-check .dot{
  position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9;
}
.cal-day.selected{outline:2.5px solid var(--pink-500);outline-offset:-1px;}

.cal-legend{
  display:flex;gap:14px;justify-content:center;margin-top:14px;padding-top:14px;
  border-top:1px dashed var(--pink-150);font-size:11px;color:var(--text-soft);
}
.legend-item{display:flex;align-items:center;gap:5px;}
.legend-dot{width:12px;height:12px;border-radius:4px;}
.legend-dot.full{background:linear-gradient(135deg,var(--pink-300),var(--pink-400));}
.legend-dot.today{background:var(--pink-150);}

.cal-detail{
  margin-top:16px;background:#fff;border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow-soft);
}
.cal-detail-title{font-size:14px;font-weight:700;color:var(--pink-600);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.cal-detail-list{display:flex;flex-direction:column;gap:8px;}
.cal-detail-item{
  display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-main);
  padding:6px 10px;background:var(--pink-50);border-radius:10px;
}
.cal-detail-item .mini-ck{font-size:14px;}
.cal-detail-empty{text-align:center;font-size:12px;color:var(--text-faint);padding:14px;}

/* 动画 */
@keyframes pop{0%{transform:scale(.8);opacity:0;}100%{transform:scale(1);opacity:1;}}
.check-item{animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes checkPop{0%{transform:scale(.4);opacity:0;}50%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
.check-circle.checked .ck{animation:checkPop .35s cubic-bezier(.34,1.56,.64,1);}

/* Toast 提示 */
.toast{
  position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);
  background:rgba(122,74,92,.92);color:#fff;padding:10px 22px;border-radius:24px;
  font-size:13px;font-weight:600;z-index:9999;transition:transform .35s cubic-bezier(.34,1.56,.64,1);
  backdrop-filter:blur(6px);box-shadow:0 6px 20px rgba(0,0,0,.15);
}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ====== SVG 风格图标系统 ====== */
.ico{display:inline-block;width:1em;height:1em;vertical-align:-.15em;fill:currentColor;}
.nav-icon svg{width:24px;height:24px;}
.add-btn svg{width:22px;height:22px;}
.add-input{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff8ab5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 19l7-7 3 3-7 7-3-3z'/><path d='M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z'/><path d='M2 2l7.586 7.586'/><circle cx='11' cy='11' r='2'/></svg>");background-repeat:no-repeat;background-position:14px center;background-size:18px 18px;padding-left:42px;}

/* 进度环中心小图标 */
.progress-ring-icon{
  position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;
  background:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-soft);
}
.progress-ring-icon svg{width:14px;height:14px;color:var(--pink-500);}

/* 标题装饰 */
.title-deco{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-300),var(--pink-500));
  box-shadow:0 0 0 4px var(--pink-100);
}

/* 节日彩屑 */
.sprinkle{
  position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;opacity:.7;
}
.spk1{top:10px;left:14px;background:var(--pink-200);}
.spk2{top:30px;right:24px;background:var(--lilac-2);width:5px;height:5px;}
.spk3{bottom:18px;left:30px;background:var(--peach);width:4px;height:4px;}
.spk4{top:60%;right:18px;background:var(--lemon);width:5px;height:5px;}

/* 心形装饰 */
.heart{
  display:inline-block;width:1em;height:1em;
  background:var(--pink-400);
  clip-path:path("M12 21s-7-4.5-9.5-9.5C.7 7 3 3 6.5 3 8.5 3 10.5 4 12 6c1.5-2 3.5-3 5.5-3 3.5 0 5.8 4 4 8.5C19 16.5 12 21 12 21z");
  color:var(--pink-400);
}

/* 日历打卡项目区域 */
.cal-items-section{
  margin-top:16px;
}
.cal-items-header{
  display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;
  color:var(--pink-600);margin-bottom:12px;
}
.cal-empty{padding:20px;}

/* 偶尔打卡操作区 */
.occ-actions{
  margin-top:16px;display:flex;flex-direction:column;gap:10px;align-items:center;
}
.occ-confirm-btn{
  width:100%;max-width:280px;padding:14px 28px;border:none;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--pink-400),var(--pink-500));
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  box-shadow:var(--shadow-pink);display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .25s cubic-bezier(.34,1.56,.64,1);
  font-family:inherit;
}
.occ-confirm-btn:active{transform:scale(.96);}
.occ-confirm-btn:disabled{opacity:.5;pointer-events:none;}
.occ-confirm-btn svg{width:20px;height:20px;}
.occ-selected-info{
  font-size:13px;color:var(--text-soft);font-weight:600;
}
.cal-day.occ-selected{
  background:var(--lilac);color:#9b6fd9;font-weight:800;
  box-shadow:0 2px 8px rgba(155,111,217,.2);
}

<div class="toast" id="toast"></div>

<script>
/* ========================================================
   数据层：localStorage 持久化 + 自动保存
   两个模块完全独立：
   - dailyData: 每日打卡（项目列表 + 每日打勾记录）
   - calData:   日历打卡（项目列表 + 每个项目自己的打卡日期集合）
   ======================================================== */
const DAILY_KEY = 'pinkcheck_daily_v2';
const CAL_KEY = 'pinkcheck_cal_v2';
const OCC_KEY = 'pinkcheck_occ_v2';
const NAV_KEY = 'pinkcheck_nav_v1';

let dailyData = loadData(DAILY_KEY, { items:[], records:{} });
let calData   = loadData(CAL_KEY,   { items:[], dates:{} }); // dates: { itemId: Set of date strings }
let occData   = loadData(OCC_KEY,   { dates:[] }); // dates: ['YYYY-MM-DD', ...]
let navOrder  = loadNavOrder();

function loadData(key, defaults){
  try{
    const raw = localStorage.getItem(key);
    if(raw){ const d = JSON.parse(raw);
      if(key===CAL_KEY){
        return { items:d.items||[], dates:d.dates||{} };
      }
      if(key===OCC_KEY){
        return { dates:d.dates||[] };
      }
      return { items:d.items||[], records:d.records||{} };
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(defaults));
}
function loadNavOrder(){
  try{
    const raw = localStorage.getItem(NAV_KEY);
    if(raw){ const a = JSON.parse(raw); if(Array.isArray(a)&&a.length===3) return a; }
  }catch(e){}
  return ['daily','calendar','occasional'];
}
function saveDaily(){
  try{ localStorage.setItem(DAILY_KEY, JSON.stringify(dailyData)); }catch(e){}
}
function saveCal(){
  try{ localStorage.setItem(CAL_KEY, JSON.stringify(calData)); }catch(e){}
}
function saveOcc(){
  try{ localStorage.setItem(OCC_KEY, JSON.stringify(occData)); }catch(e){}
}
function saveNav(){
  try{ localStorage.setItem(NAV_KEY, JSON.stringify(navOrder)); }catch(e){}
}

/* ========================================================
   工具函数
   ======================================================== */
const $ = s => document.querySelector(s);
const todayStr = () => fmtDate(new Date());
function fmtDate(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function showToast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(()=>t.classList.remove('show'),1800);
}
const cheerWords = ['加油呀，你超棒的！','再坚持一下下～','今天也要元气满满！','打卡让我快乐！','你正在变得更好！','冲鸭！'];
const randCheer = () => cheerWords[Math.floor(Math.random()*cheerWords.length)];

/* ========================================================
   导航栏渲染 + 拖拽排序
   ======================================================== */
const navConfig = {
  daily: {
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--pink-500)"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
    label:'每日打卡'
  },
  calendar: {
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--pink-500)"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><circle cx="8" cy="14" r="1" fill="currentColor"/><circle cx="12" cy="14" r="1" fill="currentColor"/><circle cx="16" cy="17" r="1" fill="currentColor"/></svg>',
    label:'日历打卡'
  },
  occasional: {
    icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--pink-500)"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
    label:'偶尔打卡'
  }
};
function renderNav(){
  const sb = $('#sidebar');
  // 清除旧导航项（保留 title 和 footer）
  sb.querySelectorAll('.nav-item').forEach(n=>n.remove());
  const footer = sb.querySelector('.sidebar-footer');
  navOrder.forEach(key=>{
    const cfg = navConfig[key];
    const el = document.createElement('button');
    el.className = 'nav-item' + (currentTab===key ? ' active' : '');
    el.dataset.key = key;
    el.draggable = true;
    el.innerHTML = `
      <span class="drag-handle">⋮⋮</span>
      <span class="nav-icon">${cfg.icon}</span>
      <span class="nav-label">${cfg.label}</span>`;
    el.addEventListener('click', ()=>switchTab(key));
    // 拖拽
    el.addEventListener('dragstart', e=>{
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', key);
    });
    el.addEventListener('dragend', ()=>{
      el.classList.remove('dragging');
      sb.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('drag-over'));
    });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=>el.classList.remove('drag-over'));
    el.addEventListener('drop', e=>{
      e.preventDefault();
      const fromKey = e.dataTransfer.getData('text/plain');
      if(fromKey && fromKey!==key){
        const fromIdx = navOrder.indexOf(fromKey);
        const toIdx = navOrder.indexOf(key);
        navOrder.splice(toIdx,0,navOrder.splice(fromIdx,1)[0]);
        saveNav(); renderNav();
        showToast('顺序已调整～');
      }
      el.classList.remove('drag-over');
    });
    sb.insertBefore(el, footer);
  });
}

/* ========================================================
   页面切换
   ======================================================== */
let currentTab = 'daily';
function switchTab(key){
  currentTab = key;
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  $('#page-'+key).classList.add('active');
  renderNav();
  if(key==='calendar') renderCalendar();
  if(key==='occasional') renderOccasional();
}

/* ========================================================
   每日打卡
   ======================================================== */
function renderDaily(){
  const today = todayStr();
  const todayRec = dailyData.records[today] || {};
  const items = dailyData.items;
  const doneCount = items.filter(it=>todayRec[it.id]).length;
  const total = items.length;
  const pct = total>0 ? doneCount/total : 0;

  // 进度环
  const circ = 2*Math.PI*38;
  $('#ringFill').setAttribute('stroke-dashoffset', circ*(1-pct));
  $('#progressNum').textContent = doneCount;

  if(total===0){
    $('#progressDesc').textContent = '还没有打卡项目哦';
    $('#progressCheer').textContent = '加一个开始今天吧～';
  }else if(doneCount===total){
    $('#progressDesc').textContent = `全部完成啦！${doneCount}/${total}`;
    $('#progressCheer').textContent = '太棒了，完美一天！';
  }else{
    $('#progressDesc').textContent = `已完成 ${doneCount} / ${total} 项`;
    $('#progressCheer').textContent = randCheer();
  }

  // 列表
  const list = $('#checkList');
  list.innerHTML = '';
  if(items.length===0){
    list.innerHTML = `<div class="empty-state"><div class="emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div class="text">还没有打卡项目<br>点击上方输入框添加吧～</div></div>`;
    return;
  }
  items.forEach(it=>{
    const checked = !!todayRec[it.id];
    const row = document.createElement('div');
    row.className = 'check-item' + (checked?' done':'');
    row.innerHTML = `
      <div class="check-circle ${checked?'checked':''}" data-id="${it.id}">
        <span class="ck"></span>
      </div>
      <div class="item-name" contenteditable="true" data-id="${it.id}">${escapeHtml(it.name)}</div>
      <div class="item-time">${checked && it.lastTime ? it.lastTime.slice(11,16) : ''}</div>
      <button class="item-del" data-id="${it.id}" title="删除">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>`;
    list.appendChild(row);
  });

  // 绑定事件
  list.querySelectorAll('.check-circle').forEach(c=>{
    c.addEventListener('click', ()=>toggleDailyCheck(c.dataset.id));
  });
  list.querySelectorAll('.item-name').forEach(n=>{
    n.addEventListener('blur', ()=>{
      const v = n.textContent.trim();
      const id = n.dataset.id;
      const it = dailyData.items.find(x=>x.id===id);
      if(it && v){ it.name=v; saveDaily(); }
      else if(it && !v){ n.textContent = it.name; }
    });
    n.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); n.blur(); } });
  });
  list.querySelectorAll('.item-del').forEach(b=>{
    b.addEventListener('click', ()=>deleteDailyItem(b.dataset.id));
  });
}

function addDailyItem(){
  const input = $('#addItemInput');
  const name = input.value.trim();
  if(!name){ showToast('请输入项目名称～'); input.focus(); return; }
  if(dailyData.items.length>=20){ showToast('最多 20 个项目哦'); return; }
  const item = { id:'di_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name, lastTime:'' };
  dailyData.items.push(item);
  saveDaily();
  input.value='';
  renderDaily();
  showToast('添加成功～');
}

function toggleDailyCheck(id){
  const today = todayStr();
  if(!dailyData.records[today]) dailyData.records[today] = {};
  const rec = dailyData.records[today];
  if(rec[id]){
    delete rec[id];
  }else{
    rec[id] = true;
    const it = dailyData.items.find(x=>x.id===id);
    if(it) it.lastTime = new Date().toTimeString().slice(0,8);
  }
  saveDaily();
  renderDaily();
}

function deleteDailyItem(id){
  dailyData.items = dailyData.items.filter(x=>x.id!==id);
  Object.keys(dailyData.records).forEach(d=>{ if(dailyData.records[d][id]) delete dailyData.records[d][id]; });
  saveDaily();
  renderDaily();
  showToast('已删除～');
}

/* ========================================================
   日历打卡（独立项目、独立日期记录）
   ======================================================== */
let calDate = new Date();
let calSelected = null;

function renderCalendar(){
  const y = calDate.getFullYear();
  const m = calDate.getMonth();
  $('#calMonth').textContent = `${y}年${m+1}月`;

  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const today = todayStr();

  // 计算本月哪些日期有打卡（任意项目）
  const checkedDates = new Set();
  const dates = calData.dates || {};
  Object.keys(dates).forEach(id=>{
    const arr = dates[id] || [];
    arr.forEach(ds=>{
      const dd = new Date(ds);
      if(dd.getFullYear()===y && dd.getMonth()===m) checkedDates.add(ds);
    });
  });

  // 统计
  let monthDays = checkedDates.size;
  let totalDays = new Set();
  Object.keys(dates).forEach(id=>{ (dates[id]||[]).forEach(ds=>totalDays.add(ds)); });
  $('#statMonth').textContent = monthDays;
  $('#statTotal').textContent = totalDays.size;
  $('#statStreak').textContent = calcCalStreak();

  // 渲染日期
  const wrap = $('#calDays');
  wrap.innerHTML = '';
  for(let i=firstDay-1;i>=0;i--){
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = prevDays-i;
    wrap.appendChild(el);
  }
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const hasCheck = checkedDates.has(ds);
    const isToday = ds===today;
    const el = document.createElement('div');
    let cls = 'cal-day';
    if(isToday) cls+=' today';
    if(hasCheck) cls+=' has-check';
    if(calSelected===ds) cls+=' selected';
    el.className = cls;
    el.dataset.date = ds;
    el.innerHTML = `${d}${hasCheck?'<span class="dot"></span>':''}`;
    el.addEventListener('click', ()=>{ calSelected = (calSelected===ds?null:ds); renderCalendar(); });
    wrap.appendChild(el);
  }
  const total = firstDay + daysInMonth;
  const remain = (7 - total%7) % 7;
  for(let i=1;i<=remain;i++){
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = i;
    wrap.appendChild(el);
  }

  renderCalDetail();
  renderCalItems();
}

function calcCalStreak(){
  let streak = 0;
  let d = new Date();
  const allDates = new Set();
  Object.keys(calData.dates||{}).forEach(id=>{ (calData.dates[id]||[]).forEach(ds=>allDates.add(ds)); });
  while(true){
    const ds = fmtDate(d);
    if(allDates.has(ds)){ streak++; d.setDate(d.getDate()-1); }
    else{
      if(streak===0){ d.setDate(d.getDate()-1); if(allDates.has(fmtDate(d))) continue; }
      break;
    }
  }
  return streak;
}

function renderCalDetail(){
  const detail = $('#calDetail');
  if(!calSelected){ detail.style.display='none'; return; }
  const dates = calData.dates || {};
  const checkedItems = calData.items.filter(it=>{
    const arr = dates[it.id] || [];
    return arr.includes(calSelected);
  });
  detail.style.display = 'block';
  $('#detailDate').textContent = calSelected;
  const list = $('#detailList');
  if(checkedItems.length===0){
    list.innerHTML = `<div class="cal-detail-empty">这一天还没有打卡项目哦</div>`;
  }else{
    list.innerHTML = checkedItems.map(it=>`<div class="cal-detail-item">${escapeHtml(it.name)}</div>`).join('');
  }
}

// 日历打卡的项目列表渲染
function renderCalItems(){
  const container = $('#calItemList');
  const items = calData.items;
  const today = todayStr();
  const dates = calData.dates || {};

  if(items.length===0){
    container.innerHTML = `<div class="empty-state cal-empty"><div class="emoji"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div><div class="text">还没有日历打卡项目<br>点击下方输入框添加吧～</div></div>`;
    return;
  }

  container.innerHTML = items.map(it=>{
    const itemDates = dates[it.id] || [];
    const todayChecked = itemDates.includes(today);
    const y = calDate.getFullYear(), m = calDate.getMonth();
    const monthCount = itemDates.filter(ds=>{
      const dd = new Date(ds);
      return dd.getFullYear()===y && dd.getMonth()===m;
    }).length;
    return `
    <div class="check-item ${todayChecked?'done':''}">
      <div class="check-circle ${todayChecked?'checked':''}" data-calid="${it.id}" data-action="toggle">
        <span class="ck"></span>
      </div>
      <div class="item-name" contenteditable="true" data-calid="${it.id}">${escapeHtml(it.name)}</div>
      <div class="item-time">本月 ${monthCount}次</div>
      <button class="item-del" data-calid="${it.id}" data-action="delete" title="删除">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>`;
  }).join('');

  // 绑定事件
  container.querySelectorAll('[data-action="toggle"]').forEach(c=>{
    c.addEventListener('click', ()=>toggleCalCheck(c.dataset.calid));
  });
  container.querySelectorAll('.item-name').forEach(n=>{
    n.addEventListener('blur', ()=>{
      const v = n.textContent.trim();
      const id = n.dataset.calid;
      const it = calData.items.find(x=>x.id===id);
      if(it && v){ it.name=v; saveCal(); }
      else if(it && !v){ n.textContent = it.name; }
    });
    n.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); n.blur(); } });
  });
  container.querySelectorAll('[data-action="delete"]').forEach(b=>{
    b.addEventListener('click', ()=>deleteCalItem(b.dataset.calid));
  });
}

function addCalItem(){
  const input = $('#calAddInput');
  const name = input.value.trim();
  if(!name){ showToast('请输入项目名称～'); input.focus(); return; }
  if(calData.items.length>=20){ showToast('最多 20 个项目哦'); return; }
  const item = { id:'ci_'+Date.now()+'_'+Math.random().toString(36).slice(2,6), name };
  calData.items.push(item);
  saveCal();
  input.value='';
  renderCalendar();
  showToast('添加成功～');
}

function toggleCalCheck(id){
  const today = todayStr();
  if(!calData.dates) calData.dates = {};
  if(!calData.dates[id]) calData.dates[id] = [];
  const arr = calData.dates[id];
  const idx = arr.indexOf(today);
  if(idx>=0){
    arr.splice(idx,1);
  }else{
    arr.push(today);
  }
  saveCal();
  renderCalendar();
}

function deleteCalItem(id){
  calData.items = calData.items.filter(x=>x.id!==id);
  if(calData.dates[id]) delete calData.dates[id];
  saveCal();
  renderCalendar();
  showToast('已删除～');
}

/* ========================================================
   偶尔打卡（独立日历 + 选中日期 + 确认按钮）
   ======================================================== */
let occCalDate = new Date();
let occSelected = new Set(); // 当前选中的日期

function renderOccasional(){
  const y = occCalDate.getFullYear();
  const m = occCalDate.getMonth();
  $('#occCalMonth').textContent = `${y}年${m+1}月`;
  $('#occToday').textContent = `${m+1}月${new Date().getDate()}日`;

  const firstDay = new Date(y,m,1).getDay();
  const daysInMonth = new Date(y,m+1,0).getDate();
  const prevDays = new Date(y,m,0).getDate();
  const today = todayStr();

  // 已打卡的日期集合
  const doneSet = new Set(occData.dates);
  // 本月统计
  const monthDone = occData.dates.filter(ds=>{
    const dd = new Date(ds);
    return dd.getFullYear()===y && dd.getMonth()===m;
  }).length;
  $('#occStatMonth').textContent = monthDone;
  $('#occStatTotal').textContent = occData.dates.length;
  $('#occStatStreak').textContent = calcOccStreak();

  // 清空当前页选中（切换月份重置选中）
  occSelected.clear();
  updateOccBtn();

  // 渲染日历
  const wrap = $('#occCalDays');
  wrap.innerHTML = '';

  // 上月填充
  for(let i=firstDay-1;i>=0;i--){
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = prevDays-i;
    wrap.appendChild(el);
  }
  // 本月
  for(let d=1; d<=daysInMonth; d++){
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isDone = doneSet.has(ds);
    const isToday = ds===today;
    const isSelected = occSelected.has(ds);
    const el = document.createElement('div');
    let cls = 'cal-day';
    if(isToday) cls+=' today';
    if(isDone) cls+=' has-check';
    if(isSelected) cls+=' occ-selected';
    el.className = cls;
    el.dataset.date = ds;
    el.innerHTML = `${d}${isDone?'<span class="dot"></span>':''}`;
    el.addEventListener('click', ()=>{
      if(isDone) return; // 已完成不能取消
      if(occSelected.has(ds)){ occSelected.delete(ds); }
      else{ occSelected.add(ds); }
      updateOccBtn();
      // 刷新视觉
      el.classList.toggle('occ-selected');
    });
    wrap.appendChild(el);
  }
  // 下月填充
  const total = firstDay + daysInMonth;
  const remain = (7 - total%7) % 7;
  for(let i=1;i<=remain;i++){
    const el = document.createElement('div');
    el.className = 'cal-day other-month';
    el.textContent = i;
    wrap.appendChild(el);
  }
}

function calcOccStreak(){
  let streak = 0;
  let d = new Date();
  const set = new Set(occData.dates);
  while(true){
    const ds = fmtDate(d);
    if(set.has(ds)){ streak++; d.setDate(d.getDate()-1); }
    else{
      if(streak===0){ d.setDate(d.getDate()-1); if(set.has(fmtDate(d))) continue; }
      break;
    }
  }
  return streak;
}

function updateOccBtn(){
  const info = $('#occSelectedInfo');
  const btn = $('#occConfirmBtn');
  const count = occSelected.size;
  if(count===0){
    info.textContent = '请点击日历选择日期';
    btn.disabled = true;
  }else{
    const dates = Array.from(occSelected).sort();
    info.textContent = `已选中 ${count} 天：${dates.join('、')}`;
    btn.disabled = false;
  }
}

function confirmOccCheck(){
  if(occSelected.size===0) return;
  const existing = new Set(occData.dates);
  occSelected.forEach(ds=>existing.add(ds));
  occData.dates = Array.from(existing).sort();
  occSelected.clear();
  saveOcc();
  renderOccasional();
  showToast('打卡成功～');
}

/* ========================================================
   设备同步状态（模拟连接标识）
   ======================================================== */
function updateSyncStatus(){
  const badge = $('#syncBadge');
  const text = $('#syncText');
  const icon = $('#syncIcon');
  if(window._multiTab){
    badge.className = 'sync-badge sync-on';
    text.textContent = '已连接';
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" style="width:8px;height:8px;"><circle cx="12" cy="12" r="6"/></svg>';
  }else{
    badge.className = 'sync-badge sync-off';
    text.textContent = '本地';
    icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="width:8px;height:8px;"><circle cx="12" cy="12" r="5"/></svg>';
  }
}

/* ========================================================
   初始化
   ======================================================== */
function init(){
  // 日期显示
  const now = new Date();
  const wd = ['日','一','二','三','四','五','六'][now.getDay()];
  $('#todayDate').textContent = `${now.getMonth()+1}月${now.getDate()}日 周${wd}`;
  $('#calToday').textContent = `${now.getMonth()+1}月${now.getDate()}日`;

  // 导航
  renderNav();

  // 每日打卡
  $('#addBtn').addEventListener('click', addDailyItem);
  $('#addItemInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addDailyItem(); });
  renderDaily();

  // 日历打卡
  $('#calAddBtn').addEventListener('click', addCalItem);
  $('#calAddInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addCalItem(); });
  $('#prevMonth').addEventListener('click', ()=>{ calDate.setMonth(calDate.getMonth()-1); renderCalendar(); });
  $('#nextMonth').addEventListener('click', ()=>{ calDate.setMonth(calDate.getMonth()+1); renderCalendar(); });

  // 偶尔打卡
  $('#occConfirmBtn').onclick = confirmOccCheck;
  $('#occPrevMonth').onclick = ()=>{ occCalDate.setMonth(occCalDate.getMonth()-1); renderOccasional(); };
  $('#occNextMonth').onclick = ()=>{ occCalDate.setMonth(occCalDate.getMonth()+1); renderOccasional(); };

  // 多标签检测（模拟设备连接）
  try{
    const bc = new BroadcastChannel('pinkcheck_sync');
    let gotPong = false;
    bc.postMessage('ping');
    bc.onmessage = e=>{
      if(e.data==='ping'){ bc.postMessage('pong'); }
      if(e.data==='pong'){ gotPong=true; window._multiTab=true; updateSyncStatus(); }
      if(e.data==='update'){
        dailyData = loadData(DAILY_KEY, { items:[], records:{} });
        calData   = loadData(CAL_KEY,   { items:[], dates:{} });
        occData   = loadData(OCC_KEY,   { dates:[] });
        if(currentTab==='daily') renderDaily();
        else if(currentTab==='calendar') renderCalendar();
        else renderOccasional();
      }
    };
    setTimeout(()=>{ if(gotPong){ window._multiTab=true; } updateSyncStatus(); }, 600);
    // 数据变更时广播
    const _sd = saveDaily, _sc = saveCal, _so = saveOcc;
    window.saveDaily = function(){ _sd(); bc.postMessage('update'); };
    window.saveCal   = function(){ _sc(); bc.postMessage('update'); };
    window.saveOcc   = function(){ _so(); bc.postMessage('update'); };
  }catch(e){ updateSyncStatus(); }

  // 每分钟刷新今日（跨天检测）
  setInterval(()=>{
    const now = new Date();
    const wd = ['日','一','二','三','四','五','六'][now.getDay()];
    $('#todayDate').textContent = `${now.getMonth()+1}月${now.getDate()}日 周${wd}`;
    if(currentTab==='daily') renderDaily();
  }, 60000);
}

document.addEventListener('DOMContentLoaded', init);

// ====== PWA Service Worker 注册 ======
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(()=>{
    console.log('SW registered');
  }).catch(()=>{});
}
</script>
