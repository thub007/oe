<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="粉粉打卡">
<meta name="theme-color" content="#ff6fa5">
<meta name="description" content="可爱马卡龙风打卡工作台">

<title>粉粉打卡 · Pink Check</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; width: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
  background: linear-gradient(135deg, #ffd6e8 0%, #ffc0d9 40%, #ffb3d1 100%);
  display: flex; align-items: center; justify-content: center;
  user-select: none; -webkit-user-select: none;
}
.phone-shell {
  position: relative; width: 414px; height: 100vh;
  max-height: 100vh; max-width: 100vw;
  background: linear-gradient(160deg, #fff0f6 0%, #ffe4ef 100%);
  overflow: hidden; display: flex; flex-direction: column;
}
@media (min-width: 460px) {
  .phone-shell {
    width: 414px; height: 896px; border-radius: 44px;
    box-shadow: 0 0 0 12px #2b1a2b, 0 0 0 14px #3d2535, 0 30px 80px rgba(180,80,140,0.45);
  }
}
.status-bar {
  height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; font-size: 14px; font-weight: 700; color: #8a3a5e; position: relative; z-index: 10;
}
.status-bar .time { letter-spacing: 0.5px; }
.notch { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: 110px; height: 28px; background: #2b1a2b; border-radius: 20px; }
.status-icons { display: flex; align-items: center; gap: 5px; }
.status-icons svg { display: block; }
.app-header {
  flex-shrink: 0; padding: 8px 22px 14px; display: flex; align-items: center; justify-content: space-between;
  background: linear-gradient(180deg, rgba(255,230,243,0.6) 0%, rgba(255,230,243,0) 100%);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.app-logo {
  width: 46px; height: 46px; border-radius: 16px;
  background: linear-gradient(135deg, #ff8fb8 0%, #ff6fa5 100%);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 14px rgba(255,111,165,0.45), inset 0 2px 4px rgba(255,255,255,0.5);
}
.app-title { font-size: 21px; font-weight: 800; color: #b3407a; letter-spacing: 1px; }
.app-sub { font-size: 11px; color: #d488b0; font-weight: 600; margin-top: 2px; }
.sync-badge {
  display: flex; align-items: center; gap: 7px; padding: 7px 13px 7px 10px;
  border-radius: 20px; font-size: 11.5px; font-weight: 700; transition: all 0.3s;
}
.sync-badge.connected { background: linear-gradient(135deg, #c8f7d4 0%, #a8eba8 100%); color: #2d8a4a; border: 2px solid #7dd87d; }
.sync-badge.disconnected { background: linear-gradient(135deg, #ffe0e0 0%, #ffc8c8 100%); color: #c04040; border: 2px solid #ff9090; }
.sync-dot { width: 9px; height: 9px; border-radius: 50%; position: relative; flex-shrink: 0; }
.sync-badge.connected .sync-dot { background: #3aa855; animation: pulseGreen 2s infinite; }
.sync-badge.disconnected .sync-dot { background: #d85050; }
@keyframes pulseGreen { 0% { box-shadow: 0 0 0 0 rgba(58,168,85,0.6); } 70% { box-shadow: 0 0 0 7px rgba(58,168,85,0); } 100% { box-shadow: 0 0 0 0 rgba(58,168,85,0); } }
.app-body { flex: 1; display: flex; overflow: hidden; padding: 0 14px 14px; gap: 10px; }
.side-nav {
  width: 78px; flex-shrink: 0; background: linear-gradient(180deg, #fff5fa 0%, #ffe9f2 100%);
  border-radius: 24px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px;
  box-shadow: 0 4px 16px rgba(255,150,190,0.25), inset 0 1px 3px rgba(255,255,255,0.8); overflow-y: auto;
}
.side-nav::-webkit-scrollbar { width: 0; }
.nav-item {
  width: 62px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 4px 8px; border-radius: 18px; cursor: pointer; transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
  position: relative; background: transparent; border: none;
}
.nav-item:active { transform: scale(0.92); }
.nav-item.active { background: linear-gradient(135deg, #ff9ec4 0%, #ff7eb0 100%); box-shadow: 0 5px 14px rgba(255,126,176,0.5), inset 0 1px 2px rgba(255,255,255,0.5); }
.nav-item.active .nav-icon-wrap { background: rgba(255,255,255,0.35); }
.nav-item.active .nav-label { color: #fff; text-shadow: 0 1px 3px rgba(180,60,120,0.3); }
.nav-icon-wrap { width: 38px; height: 38px; border-radius: 13px; background: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; transition: all 0.25s; }
.nav-label { font-size: 10.5px; font-weight: 700; color: #b06a90; transition: color 0.25s; }
.drag-handle { position: absolute; top: 3px; right: 3px; width: 14px; height: 14px; opacity: 0; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
.nav-item.editing .drag-handle { opacity: 0.6; }
.nav-item.dragging { opacity: 0.4; transform: scale(0.95); }
.nav-item.drag-over { background: rgba(255,158,196,0.25); border: 2px dashed #ff9ec4; }
.nav-add-btn {
  width: 62px; height: 50px; flex-shrink: 0; border-radius: 18px; border: 2px dashed #ffb3d1;
  background: rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; color: #d07aa8;
}
.nav-add-btn:active { transform: scale(0.9); background: rgba(255,180,220,0.3); }
.nav-spacer { flex: 1; min-height: 4px; }
.nav-edit-toggle {
  width: 62px; height: 42px; flex-shrink: 0; border-radius: 16px; border: none;
  background: linear-gradient(135deg, #ffd0e6 0%, #ffb8d8 100%); display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; color: #b3407a; box-shadow: 0 3px 8px rgba(255,150,190,0.3);
}
.nav-edit-toggle:active { transform: scale(0.9); }
.nav-edit-toggle.active { background: linear-gradient(135deg, #ff9ec4 0%, #ff7eb0 100%); color: #fff; }
.main-content {
  flex: 1; overflow: hidden; display: flex; flex-direction: column;
  background: linear-gradient(180deg, #fff8fb 0%, #fff0f6 100%); border-radius: 24px;
  box-shadow: 0 4px 16px rgba(255,150,190,0.2), inset 0 1px 3px rgba(255,255,255,0.9);
}
.page { display: none; flex: 1; flex-direction: column; overflow: hidden; }
.page.active { display: flex; }
.daily-page { padding: 16px 16px 0; }
.page-title-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.page-title { font-size: 19px; font-weight: 800; color: #b3407a; display: flex; align-items: center; gap: 8px; }
.page-title svg { flex-shrink: 0; }
.page-date { font-size: 11.5px; color: #c883a8; font-weight: 600; }
.progress-card {
  background: linear-gradient(135deg, #fff0f6 0%, #ffe0ee 100%); border-radius: 20px; padding: 16px 18px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 14px rgba(255,150,190,0.2), inset 0 1px 2px rgba(255,255,255,0.8); border: 2px solid #ffd9ea;
}
.progress-ring-wrap { position: relative; width: 76px; height: 76px; flex-shrink: 0; }
.progress-ring { transform: rotate(-90deg); }
.progress-ring circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.progress-ring .bg { stroke: rgba(255,180,220,0.35); }
.progress-ring .fg { stroke: url(#gradPink); transition: stroke-dashoffset 0.6s cubic-bezier(0.4,0,0.2,1); }
.progress-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
.progress-num { font-size: 22px; font-weight: 800; color: #d04890; line-height: 1; }
.progress-total { font-size: 11px; color: #c883a8; font-weight: 600; }
.progress-info { flex: 1; }
.progress-text { font-size: 14px; font-weight: 700; color: #a83a72; margin-bottom: 3px; }
.progress-desc { font-size: 11.5px; color: #c883a8; line-height: 1.5; }
.progress-emoji { font-size: 26px; }
.check-list { flex: 1; overflow-y: auto; padding-bottom: 16px; }
.check-list::-webkit-scrollbar { width: 4px; }
.check-list::-webkit-scrollbar-thumb { background: #ffc0d9; border-radius: 4px; }
.check-list::-webkit-scrollbar-track { background: transparent; }
.check-item {
  display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #fff8fb 0%, #fff0f6 100%);
  border-radius: 18px; padding: 12px 14px; margin-bottom: 10px; border: 2px solid #ffe0ee;
  box-shadow: 0 3px 10px rgba(255,150,190,0.12); transition: all 0.25s; animation: slideIn 0.35s ease;
}
.check-item.done { background: linear-gradient(135deg, #e8f9ee 0%, #d4f0dc 100%); border-color: #b8e8c8; }
.check-item:active { transform: scale(0.98); }
@keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.check-circle {
  width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.25s; background: linear-gradient(135deg, #fff0f6 0%, #ffe0ee 100%); border: 3px solid #ffb8d8;
}
.check-circle:active { transform: scale(0.85); }
.check-item.done .check-circle { background: linear-gradient(135deg, #8de8a8 0%, #5fd888 100%); border-color: #4ac870; box-shadow: 0 3px 8px rgba(90,200,120,0.4); }
.check-info { flex: 1; min-width: 0; }
.check-name { font-size: 14.5px; font-weight: 700; color: #8a3a5e; }
.check-item.done .check-name { color: #4a8a5e; }
.check-meta { font-size: 11px; color: #c883a8; margin-top: 2px; }
.check-item.done .check-meta { color: #7ab890; }
.check-delete {
  width: 30px; height: 30px; border-radius: 10px; flex-shrink: 0; background: rgba(255,200,220,0.3); border: none;
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: #d07aa8; transition: all 0.2s;
}
.check-delete:active { transform: scale(0.85); background: rgba(255,150,180,0.4); }
.empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #d488b0; padding: 30px; }
.empty-state .emoji { font-size: 52px; }
.empty-state .text { font-size: 14px; font-weight: 600; text-align: center; }
.fab {
  position: absolute; bottom: 22px; right: 22px; width: 56px; height: 56px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, #ff9ec4 0%, #ff6fa5 100%); box-shadow: 0 6px 18px rgba(255,111,165,0.5), inset 0 2px 4px rgba(255,255,255,0.4);
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s; z-index: 20;
}
.fab:active { transform: scale(0.88); }
.cal-page { padding: 16px 14px 0; }
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-month-nav { display: flex; align-items: center; gap: 10px; }
.cal-nav-btn {
  width: 32px; height: 32px; border-radius: 11px; border: none; background: linear-gradient(135deg, #ffd0e6 0%, #ffb8d8 100%);
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: #b3407a; transition: all 0.2s; box-shadow: 0 2px 6px rgba(255,150,190,0.25);
}
.cal-nav-btn:active { transform: scale(0.85); }
.cal-month-title { font-size: 17px; font-weight: 800; color: #b3407a; min-width: 110px; text-align: center; }
.cal-stats { display: flex; gap: 10px; margin-bottom: 12px; }
.stat-card { flex: 1; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 10px; box-shadow: 0 3px 10px rgba(255,150,190,0.15); }
.stat-card.s1 { background: linear-gradient(135deg, #fff0f6 0%, #ffe0ee 100%); border: 2px solid #ffd0e6; }
.stat-card.s2 { background: linear-gradient(135deg, #fff5e8 0%, #ffe8d0 100%); border: 2px solid #ffd8b0; }
.stat-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.stat-card.s1 .stat-icon { background: linear-gradient(135deg, #ffb0d0 0%, #ff8eb8 100%); }
.stat-card.s2 .stat-icon { background: linear-gradient(135deg, #ffc890 0%, #ffa860 100%); }
.stat-val { font-size: 19px; font-weight: 800; color: #8a3a5e; line-height: 1; }
.stat-label { font-size: 10.5px; color: #c883a8; font-weight: 600; margin-top: 2px; }
.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 6px; }
.cal-weekday { text-align: center; font-size: 11px; font-weight: 700; color: #c883a8; padding: 4px 0; }
.cal-weekday.weekend { color: #e878a8; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; flex: 1; overflow-y: auto; }
.cal-grid::-webkit-scrollbar { width: 0; }
.cal-day {
  aspect-ratio: 1; border-radius: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; color: #8a3a5e; cursor: pointer; transition: all 0.2s; position: relative;
  background: rgba(255,255,255,0.5); border: 2px solid transparent;
}
.cal-day:active { transform: scale(0.9); }
.cal-day.other-month { color: #e0c0d0; background: transparent; }
.cal-day.today { border-color: #ff8eb8; background: linear-gradient(135deg, #fff5fa 0%, #ffe8f2 100%); }
.cal-day.today::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 5px; height: 5px; border-radius: 50%; background: #ff6fa5; }
.cal-day.checked { background: linear-gradient(135deg, #ffb0d0 0%, #ff8eb8 100%); color: #fff; box-shadow: 0 3px 8px rgba(255,142,184,0.45); }
.cal-day.checked::before { content: ''; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: #fff; }
.cal-day.selected { border-color: #b3407a; border-width: 3px; box-shadow: 0 0 0 3px rgba(179,64,122,0.15); }
.cal-day.selected.checked { border-color: #fff; }
.cal-action-bar {
  flex-shrink: 0; margin-top: 10px; padding: 12px; background: linear-gradient(135deg, #fff0f6 0%, #ffe4ee 100%);
  border-radius: 18px; border: 2px solid #ffd0e6; display: flex; align-items: center; justify-content: space-between; gap: 10px; box-shadow: 0 3px 10px rgba(255,150,190,0.15);
}
.cal-selected-info { flex: 1; }
.cal-selected-date { font-size: 14px; font-weight: 800; color: #b3407a; }
.cal-selected-status { font-size: 11px; color: #c883a8; margin-top: 2px; font-weight: 600; }
.cal-action-btn { padding: 9px 16px; border-radius: 14px; border: none; font-size: 12.5px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
.cal-action-btn:active { transform: scale(0.92); }
.cal-action-btn.check { background: linear-gradient(135deg, #ff9ec4 0%, #ff6fa5 100%); color: #fff; box-shadow: 0 3px 8px rgba(255,111,165,0.4); }
.cal-action-btn.uncheck { background: linear-gradient(135deg, #ffd0d0 0%, #ffb0b0 100%); color: #c04040; box-shadow: 0 3px 8px rgba(200,80,80,0.3); }
.modal-mask {
  position: absolute; inset: 0; background: rgba(80,30,60,0.35); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  display: none; align-items: center; justify-content: center; z-index: 100;
}
.modal-mask.show { display: flex; animation: fadeIn 0.2s; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: 300px; background: linear-gradient(180deg, #fff8fb 0%, #fff0f6 100%); border-radius: 24px; padding: 22px;
  box-shadow: 0 20px 50px rgba(150,40,90,0.3); border: 3px solid #ffd0e6; animation: popIn 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn { from { opacity:0; transform: scale(0.8); } to { opacity:1; transform: scale(1); } }
.modal-title { font-size: 17px; font-weight: 800; color: #b3407a; text-align: center; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: #c883a8; text-align: center; margin-bottom: 16px; font-weight: 600; }
.modal-input { width: 100%; padding: 12px 14px; border-radius: 14px; border: 2px solid #ffd0e6; background: #fff; font-size: 14px; color: #8a3a5e; font-weight: 600; outline: none; transition: border 0.2s; margin-bottom: 16px; }
.modal-input:focus { border-color: #ff8eb8; }
.modal-btns { display: flex; gap: 10px; }
.modal-btn { flex: 1; padding: 11px; border-radius: 14px; border: none; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
.modal-btn:active { transform: scale(0.95); }
.modal-btn.cancel { background: #ffe0ee; color: #c070a0; }
.modal-btn.confirm { background: linear-gradient(135deg, #ff9ec4 0%, #ff6fa5 100%); color: #fff; box-shadow: 0 3px 10px rgba(255,111,165,0.4); }
.toast {
  position: absolute; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: rgba(80,30,60,0.92); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: all 0.3s; z-index: 200; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,0.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.home-indicator { height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.home-indicator-bar { width: 130px; height: 5px; border-radius: 3px; background: #d488b0; opacity: 0.6; }
svg defs { display: none; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9ec4"/>
      <stop offset="100%" stop-color="#ff6fa5"/>
    </linearGradient>
  </defs>
</svg>

<div class="phone-shell">
  <div class="status-bar">
    <span class="time" id="statusTime">9:41</span>
    <div class="notch"></div>
    <div class="status-icons">
      <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1" fill="#8a3a5e"/><rect x="4.5" y="5" width="3" height="6" rx="1" fill="#8a3a5e"/><rect x="9" y="2.5" width="3" height="8.5" rx="1" fill="#8a3a5e"/><rect x="13.5" y="0" width="3" height="11" rx="1" fill="#8a3a5e"/></svg>
      <svg width="16" height="11" viewBox="0 0 16 11"><path d="M8 11L10.5 8.5C9.4 7.4 6.6 7.4 5.5 8.5L8 11Z" fill="#8a3a5e"/><path d="M8 5.5C6 5.5 4.1 6.3 2.7 7.6L4.4 9.3C5.4 8.3 6.7 7.8 8 7.8C9.3 7.8 10.6 8.3 11.6 9.3L13.3 7.6C11.9 6.3 10 5.5 8 5.5Z" fill="#8a3a5e"/><path d="M8 2C5 2 2.2 3.2 0 5.2L1.7 6.9C3.4 5.4 5.6 4.5 8 4.5C10.4 4.5 12.6 5.4 14.3 6.9L16 5.2C13.8 3.2 11 2 8 2Z" fill="#8a3a5e"/></svg>
      <svg width="27" height="12" viewBox="0 0 27 12"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="#8a3a5e" opacity="0.2"/><rect x="23.5" y="3.5" width="2.5" height="5" rx="1" fill="#8a3a5e"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#8a3a5e"/></svg>
    </div>
  </div>

  <div class="app-header">
    <div class="header-left">
      <div class="app-logo">
        <svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 23C13 23 3 16.5 3 9.8C3 6.5 5.5 4 8.7 4C10.8 4 12.4 5.2 13 6.5C13.6 5.2 15.2 4 17.3 4C20.5 4 23 6.5 23 9.8C23 16.5 13 23 13 23Z" fill="#ffffff"/></svg>
      </div>
      <div>
        <div class="app-title">粉粉打卡</div>
        <div class="app-sub">每天进步一点点 ♡</div>
      </div>
    </div>
    <div class="sync-badge disconnected" id="syncBadge">
      <span class="sync-dot"></span>
      <span id="syncText">未连接</span>
    </div>
  </div>

  <div class="app-body">
    <nav class="side-nav" id="sideNav">
      <div class="nav-spacer"></div>
      <button class="nav-add-btn" id="navAddBtn" title="添加分类">
        <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 4C11.55 4 12 4.45 12 5V10H17C17.55 10 18 10.45 18 11C18 11.55 17.55 12 17 12H12V17C12 17.55 11.55 18 11 18C10.45 18 10 17.55 10 17V12H5C4.45 12 4 11.55 4 11C4 10.45 4.45 10 5 10H10V5C10 4.45 10.45 4 11 4Z" fill="#d07aa8"/></svg>
      </button>
      <button class="nav-edit-toggle" id="navEditToggle" title="编辑排序">
        <svg width="18" height="18" viewBox="0 0 18 18"><rect x="3" y="4" width="12" height="2" rx="1" fill="currentColor"/><rect x="3" y="8" width="12" height="2" rx="1" fill="currentColor"/><rect x="3" y="12" width="12" height="2" rx="1" fill="currentColor"/></svg>
      </button>
    </nav>

    <main class="main-content" id="mainContent">
      <div class="page cal-page" id="page-occasional">
        <div class="cal-header">
          <div class="cal-month-nav">
            <button class="cal-nav-btn" id="prevMonth">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M9 2L4 7L9 12L9 2Z" fill="#b3407a"/></svg>
            </button>
            <div class="cal-month-title" id="monthTitle">2026年7月</div>
            <button class="cal-nav-btn" id="nextMonth">
              <svg width="14" height="14" viewBox="0 0 14 14"><path d="M5 2L10 7L5 12L5 2Z" fill="#b3407a"/></svg>
            </button>
          </div>
          <svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 2C11 2 9 6 6 7.5C6 11 7.5 15 11 18C14.5 15 16 11 16 7.5C13 6 11 2 11 2Z" fill="#ff8eb8"/><path d="M11 7C11 7 10 9 8.5 9.8C8.5 11.5 9.3 13.5 11 14.8C12.7 13.5 13.5 11.5 13.5 9.8C12 9 11 7 11 7Z" fill="#fff5fa"/></svg>
        </div>

        <div class="cal-stats">
          <div class="stat-card s1">
            <div class="stat-icon">
              <svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2L12.4 6.8L17.5 7.6L13.8 11.2L14.7 16.3L10 13.9L5.3 16.3L6.2 11.2L2.5 7.6L7.6 6.8L10 2Z" fill="#ffffff"/></svg>
            </div>
            <div>
              <div class="stat-val" id="monthCount">0</div>
              <div class="stat-label">本月打卡</div>
            </div>
          </div>
          <div class="stat-card s2">
            <div class="stat-icon">
              <svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#ffffff"/><path d="M10 6L10 10L13 11.5L10 6Z" fill="#ffa860"/></svg>
            </div>
            <div>
              <div class="stat-val" id="intervalDays">0</div>
              <div class="stat-label">间隔天数</div>
            </div>
          </div>
        </div>

        <div class="cal-weekdays">
          <div class="cal-weekday weekend">日</div>
          <div class="cal-weekday">一</div>
          <div class="cal-weekday">二</div>
          <div class="cal-weekday">三</div>
          <div class="cal-weekday">四</div>
          <div class="cal-weekday">五</div>
          <div class="cal-weekday weekend">六</div>
        </div>

        <div class="cal-grid" id="calGrid"></div>

        <div class="cal-action-bar" id="calActionBar" style="display:none">
          <div class="cal-selected-info">
            <div class="cal-selected-date" id="selDateText"></div>
            <div class="cal-selected-status" id="selDateStatus"></div>
          </div>
          <button class="cal-action-btn check" id="calCheckBtn" style="display:none">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7L5.5 11L12 3.5L5.5 11L2 7Z" fill="#ffffff"/></svg>
            打卡
          </button>
          <button class="cal-action-btn uncheck" id="calUncheckBtn" style="display:none">
            <svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 3L11 11L3 11L11 3L3 3Z" fill="#c04040"/></svg>
            取消
          </button>
        </div>
      </div>
    </main>
  </div>

  <button class="fab" id="fabAdd" style="display:none">
    <svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 5C13.55 5 14 5.45 14 6V12H20C20.55 12 21 12.45 21 13C21 13.55 20.55 14 20 14H14V20C14 20.55 13.55 21 13 21C12.45 21 12 20.55 12 20V14H6C5.45 14 5 13.55 5 13C5 12.45 5.45 12 6 12H12V6C12 5.45 12.45 5 13 5Z" fill="#ffffff"/></svg>
  </button>

  <div class="home-indicator"><div class="home-indicator-bar"></div></div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-title" id="modalTitle">添加打卡项目</div>
      <div class="modal-sub" id="modalSub">给新项目起个可爱的名字吧</div>
      <input class="modal-input" id="modalInput" type="text" placeholder="例如：喝水、早睡、运动..." maxlength="20">
      <div class="modal-btns">
        <button class="modal-btn cancel" id="modalCancel">取消</button>
        <button class="modal-btn confirm" id="modalConfirm">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
(function(){
  'use strict';
  const STORAGE_KEY = 'pinkcheck_data_v1';
  let store = { categories: [], dailyRecords: {}, occasionalRecords: {}, navOrder: [] };
  const DEFAULT_CATEGORIES = [
    { id: 'cat_daily1', name: '每日打卡', icon: 'daily', type: 'daily', items: [] },
    { id: 'cat_occasional', name: '偶尔打卡', icon: 'calendar', type: 'occasional' },
  ];

  // 图标库 - 全部纯色填充，无透明部分
  const ICONS = {
    daily: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><rect x="3" y="5" width="16" height="14" rx="3" fill="'+c+'"/><rect x="3" y="5" width="16" height="4" rx="2" fill="'+c+'"/><rect x="6" y="2" width="3" height="5" rx="1.5" fill="'+c+'"/><rect x="13" y="2" width="3" height="5" rx="1.5" fill="'+c+'"/><path d="M7 13L9.5 15.5L15 10L9.5 15.5L7 13Z" fill="#ffffff"/></svg>',
    calendar: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><rect x="3" y="5" width="16" height="14" rx="3" fill="'+c+'"/><rect x="6" y="2" width="3" height="5" rx="1.5" fill="'+c+'"/><rect x="13" y="2" width="3" height="5" rx="1.5" fill="'+c+'"/><circle cx="7.5" cy="12" r="1.4" fill="#ffffff"/><circle cx="11" cy="12" r="1.4" fill="#ffffff"/><circle cx="14.5" cy="12" r="1.4" fill="#ffffff"/><circle cx="7.5" cy="15.5" r="1.4" fill="#ffffff"/><circle cx="11" cy="15.5" r="1.4" fill="#ffffff"/></svg>',
    water: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 2C11 2 4.5 9 4.5 14C4.5 17.6 7.4 20.5 11 20.5C14.6 20.5 17.5 17.6 17.5 14C17.5 9 11 2 11 2Z" fill="'+c+'"/><circle cx="9" cy="14" r="1.5" fill="#ffffff"/></svg>',
    heart: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 19C11 19 2.5 13.5 2.5 8C2.5 5.2 4.7 3 7.5 3C9.3 3 10.6 4 11 5C11.4 4 12.7 3 14.5 3C17.3 3 19.5 5.2 19.5 8C19.5 13.5 11 19 11 19Z" fill="'+c+'"/></svg>',
    star: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><path d="M11 2L13.6 7.6L19.5 8.4L15.2 12.6L16.3 18.5L11 15.6L5.7 18.5L6.8 12.6L2.5 8.4L8.4 7.6L11 2Z" fill="'+c+'"/></svg>',
    book: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><rect x="3" y="4" width="7" height="14" rx="1.5" fill="'+c+'"/><rect x="12" y="4" width="7" height="14" rx="1.5" fill="'+c+'"/><rect x="10" y="4" width="2" height="14" fill="'+c+'"/></svg>',
    run: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="14" cy="4.5" r="2.5" fill="'+c+'"/><path d="M5 19L8 13L11 15L14 11L17 14L5 19Z" fill="'+c+'"/><path d="M8 13L6 9L10 8L8 13Z" fill="'+c+'"/></svg>',
    flower: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="5" r="3" fill="'+c+'"/><circle cx="17" cy="9" r="3" fill="'+c+'"/><circle cx="15" cy="16" r="3" fill="'+c+'"/><circle cx="7" cy="16" r="3" fill="'+c+'"/><circle cx="5" cy="9" r="3" fill="'+c+'"/><circle cx="11" cy="11" r="2.6" fill="#ffffff"/></svg>',
    sun: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="4.5" fill="'+c+'"/><rect x="10" y="1" width="2" height="4" rx="1" fill="'+c+'"/><rect x="10" y="17" width="2" height="4" rx="1" fill="'+c+'"/><rect x="1" y="10" width="4" height="2" rx="1" fill="'+c+'"/><rect x="17" y="10" width="4" height="2" rx="1" fill="'+c+'"/><rect x="3.5" y="3.5" width="3" height="2" rx="1" transform="rotate(-45 5 4.5)" fill="'+c+'"/><rect x="15.5" y="3.5" width="3" height="2" rx="1" transform="rotate(45 17 4.5)" fill="'+c+'"/><rect x="3.5" y="16.5" width="3" height="2" rx="1" transform="rotate(45 5 17.5)" fill="'+c+'"/><rect x="15.5" y="16.5" width="3" height="2" rx="1" transform="rotate(-45 17 17.5)" fill="'+c+'"/></svg>',
    moon: (c) => '<svg width="22" height="22" viewBox="0 0 22 22"><path d="M14 2C9.5 2 6 5.5 6 10C6 14.5 9.5 18 14 18C14.8 18 15.5 17.9 16.2 17.7C12.8 17.2 10.2 14.3 10.2 10.8C10.2 7 13.2 4 17 4C16 2.8 15 2 14 2Z" fill="'+c+'"/></svg>',
  };
  const ICON_KEYS = Object.keys(ICONS);
  const NAV_ICON_COLOR = '#e878a8';

  function todayStr() {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function uid() { return 'cat_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); updateSyncStatus(); }
    catch(e) { console.error('保存失败', e); }
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        store = Object.assign({categories:[],dailyRecords:{},occasionalRecords:{},navOrder:[]}, parsed);
      } else {
        store.categories = DEFAULT_CATEGORIES.map(c => Object.assign({}, c));
        store.navOrder = store.categories.map(c => c.id);
        save();
      }
    } catch(e) {
      store.categories = DEFAULT_CATEGORIES.map(c => Object.assign({}, c));
      store.navOrder = store.categories.map(c => c.id);
    }
    store.categories.forEach(c => { if (!store.navOrder.includes(c.id)) store.navOrder.push(c.id); });
    store.categories.forEach(c => { if (c.type==='daily' && !store.dailyRecords[c.id]) store.dailyRecords[c.id]={}; });
  }

  function updateSyncStatus() {
    const badge = document.getElementById('syncBadge');
    const text = document.getElementById('syncText');
    const online = navigator.onLine;
    const hasData = localStorage.getItem(STORAGE_KEY) !== null;
    if (online && hasData) { badge.className='sync-badge connected'; text.textContent='已同步'; }
    else if (hasData) { badge.className='sync-badge connected'; text.textContent='本地已存'; }
    else { badge.className='sync-badge disconnected'; text.textContent='未连接'; }
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1800);
  }

  let modalCallback = null;
  function showModal(title, sub, placeholder, cb, defaultVal) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalSub').textContent = sub;
    const input = document.getElementById('modalInput');
    input.value = defaultVal || '';
    input.placeholder = placeholder || '';
    modalCallback = cb;
    document.getElementById('modalMask').classList.add('show');
    setTimeout(function(){ input.focus(); }, 100);
  }
  function hideModal() { document.getElementById('modalMask').classList.remove('show'); modalCallback = null; }
  document.getElementById('modalCancel').addEventListener('click', hideModal);
  document.getElementById('modalMask').addEventListener('click', function(e){ if(e.target.id==='modalMask') hideModal(); });
  document.getElementById('modalConfirm').addEventListener('click', function(){
    const val = document.getElementById('modalInput').value.trim();
    if (val && modalCallback) { const cb = modalCallback; hideModal(); cb(val); }
    else if (!val) { toast('名字不能为空哦~'); }
  });
  document.getElementById('modalInput').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('modalConfirm').click(); });

  let activeCategoryId = null;
  let isEditing = false;
  function getActiveCategory() { return store.categories.find(c => c.id === activeCategoryId); }

  function renderNav() {
    const nav = document.getElementById('sideNav');
    const spacer = nav.querySelector('.nav-spacer');
    nav.querySelectorAll('.nav-item').forEach(function(n){ n.remove(); });
    const ordered = store.navOrder.map(function(id){ return store.categories.find(c => c.id===id); }).filter(Boolean);
    ordered.forEach(function(cat){
      const item = document.createElement('button');
      item.className = 'nav-item'+(cat.id===activeCategoryId?' active':'')+(isEditing?' editing':'');
      item.dataset.id = cat.id;
      item.draggable = isEditing;
      const iconFn = ICONS[cat.icon] || ICONS.star;
      const shortName = cat.name.length>4 ? cat.name.slice(0,3)+'…' : cat.name;
      item.innerHTML = '<div class="nav-icon-wrap">'+iconFn(NAV_ICON_COLOR)+'</div>'+
        '<span class="nav-label">'+escapeHtml(shortName)+'</span>'+
        '<span class="drag-handle"><svg width="10" height="14" viewBox="0 0 10 14"><circle cx="2" cy="2" r="1.3" fill="#b3407a"/><circle cx="8" cy="2" r="1.3" fill="#b3407a"/><circle cx="2" cy="7" r="1.3" fill="#b3407a"/><circle cx="8" cy="7" r="1.3" fill="#b3407a"/><circle cx="2" cy="12" r="1.3" fill="#b3407a"/><circle cx="8" cy="12" r="1.3" fill="#b3407a"/></svg></span>';
      item.addEventListener('click', function(e){
        if (isEditing && e.target.closest('.drag-handle')) return;
        if (isEditing) { renameCategory(cat.id); return; }
        switchToCategory(cat.id);
      });
      item.addEventListener('contextmenu', function(e){
        e.preventDefault();
        if (isEditing && cat.id!=='cat_daily1' && cat.id!=='cat_occasional') {
          if (confirm('删除「'+cat.name+'」吗？相关数据会一起删除哦~')) deleteCategory(cat.id);
        }
      });
      item.addEventListener('dragstart', handleDragStart);
      item.addEventListener('dragover', handleDragOver);
      item.addEventListener('drop', handleDrop);
      item.addEventListener('dragend', handleDragEnd);
      item.addEventListener('dragleave', handleDragLeave);
      nav.insertBefore(item, spacer);
    });
  }

  let draggedId = null;
  function handleDragStart(e) { if(!isEditing){e.preventDefault();return;} draggedId=this.dataset.id; this.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; }
  function handleDragOver(e) { if(!isEditing)return; e.preventDefault(); e.dataTransfer.dropEffect='move'; if(this.dataset.id!==draggedId) this.classList.add('drag-over'); }
  function handleDragLeave() { this.classList.remove('drag-over'); }
  function handleDrop(e) {
    if(!isEditing)return; e.preventDefault(); e.stopPropagation(); this.classList.remove('drag-over');
    const targetId=this.dataset.id;
    if (draggedId && targetId && draggedId!==targetId) {
      const arr=store.navOrder; const fromIdx=arr.indexOf(draggedId); const toIdx=arr.indexOf(targetId);
      arr.splice(fromIdx,1); arr.splice(toIdx,0,draggedId); save(); renderNav();
    }
  }
  function handleDragEnd() { this.classList.remove('dragging'); document.querySelectorAll('.nav-item').forEach(function(n){n.classList.remove('drag-over');}); draggedId=null; }

  function switchToCategory(id) { activeCategoryId=id; const cat=getActiveCategory(); if(!cat)return; renderNav(); renderPage(cat); }

  function renderPage(cat) {
    const main=document.getElementById('mainContent');
    main.querySelectorAll('.daily-page').forEach(function(p){p.remove();});
    const occPage=document.getElementById('page-occasional');
    occPage.classList.remove('active');
    document.getElementById('fabAdd').style.display='none';
    if (cat.type==='daily') {
      const page=buildDailyPage(cat); main.insertBefore(page, occPage);
      page.classList.add('active'); document.getElementById('fabAdd').style.display='flex';
      renderDailyList(cat);
    } else if (cat.type==='occasional') {
      occPage.classList.add('active'); renderCalendar();
    }
  }

  function buildDailyPage(cat) {
    const page=document.createElement('div');
    page.className='page daily-page'; page.id='page-'+cat.id;
    const iconFn=ICONS[cat.icon]||ICONS.star;
    const d=new Date(); const weekDays=['日','一','二','三','四','五','六'];
    page.innerHTML =
      '<div class="page-title-row">'+
        '<div class="page-title">'+iconFn('#d04890')+'<span>'+escapeHtml(cat.name)+'</span></div>'+
        '<div class="page-date">'+(d.getMonth()+1)+'月'+d.getDate()+'日 周'+weekDays[d.getDay()]+'</div>'+
      '</div>'+
      '<div class="progress-card">'+
        '<div class="progress-ring-wrap">'+
          '<svg class="progress-ring" width="76" height="76"><circle class="bg" cx="38" cy="38" r="32"/><circle class="fg" cx="38" cy="38" r="32" stroke-dasharray="201.06" stroke-dashoffset="201.06" id="ringFg-'+cat.id+'"/></svg>'+
          '<div class="progress-center"><div class="progress-num" id="progNum-'+cat.id+'">0</div><div class="progress-total" id="progTotal-'+cat.id+'">/0</div></div>'+
        '</div>'+
        '<div class="progress-info"><div class="progress-text" id="progText-'+cat.id+'">加油加油~</div><div class="progress-desc" id="progDesc-'+cat.id+'">完成今日打卡</div></div>'+
        '<div class="progress-icon" id="progIcon-'+cat.id+'"><svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 3L15.5 8.5L21 9.5L17 13.5L17.8 19L13 16.5L8.2 19L9 13.5L5 9.5L10.5 8.5L13 3Z" fill="#ff8eb8"/></svg></div>'+
      '</div>'+
      '<div class="check-list" id="list-'+cat.id+'"></div>';
    return page;
  }

  function renderDailyList(cat) {
    const list=document.getElementById('list-'+cat.id); if(!list)return;
    const records=store.dailyRecords[cat.id]||{}; const today=todayStr(); const items=cat.items||[];
    list.innerHTML='';
    if (items.length===0) {
      list.innerHTML='<div class="empty-state"><div class="emoji"><svg width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="18" fill="#ff8eb8"/><circle cx="24" cy="24" r="8" fill="#ffffff"/><circle cx="24" cy="16" r="4" fill="#ff6fa5"/><circle cx="32" cy="24" r="4" fill="#ff6fa5"/><circle cx="24" cy="32" r="4" fill="#ff6fa5"/><circle cx="16" cy="24" r="4" fill="#ff6fa5"/></svg></div><div class="text">还没有打卡项目<br>点击右下角 + 添加吧~</div></div>';
    } else {
      items.forEach(function(item){
        const done = !!records[today] && records[today][item.id];
        const el=document.createElement('div');
        el.className='check-item'+(done?' done':'');
        el.innerHTML='<div class="check-circle" data-item-id="'+item.id+'">'+(done?'<svg width="22" height="22" viewBox="0 0 22 22"><path d="M4 11L9 16L18 6L9 16L4 11Z" fill="#ffffff"/></svg>':'')+'</div>'+
          '<div class="check-info"><div class="check-name">'+escapeHtml(item.name)+'</div><div class="check-meta">'+(done?'今日已完成 ✓':'未打卡')+'</div></div>'+
          '<button class="check-delete" data-del-id="'+item.id+'">✕</button>';
        el.querySelector('.check-circle').addEventListener('click', function(){ toggleDailyItem(cat.id, item.id); });
        el.querySelector('.check-delete').addEventListener('click', function(e){ e.stopPropagation(); deleteDailyItem(cat.id, item.id); });
        list.appendChild(el);
      });
    }
    updateProgress(cat);
  }

  function updateProgress(cat) {
    const records=store.dailyRecords[cat.id]||{}; const today=todayStr(); const todayRecs=records[today]||{};
    const items=cat.items||[]; const doneCount=items.filter(function(i){return todayRecs[i.id];}).length; const total=items.length;
    const pct=total>0?doneCount/total:0;
    const ring=document.getElementById('ringFg-'+cat.id); const circ=2*Math.PI*32;
    if (ring) ring.style.strokeDashoffset=circ*(1-pct);
    const numEl=document.getElementById('progNum-'+cat.id); if(numEl) numEl.textContent=doneCount;
    const totalEl=document.getElementById('progTotal-'+cat.id); if(totalEl) totalEl.textContent='/'+total;
    const textEl=document.getElementById('progText-'+cat.id); const descEl=document.getElementById('progDesc-'+cat.id); const emojiEl=document.getElementById('progEmoji-'+cat.id);
    if (textEl && descEl && emojiEl) {
      if (total===0) { textEl.textContent='快开始吧~'; descEl.textContent='添加第一个打卡项目'; emojiEl.textContent='🌸'; }
      else if (pct===0) { textEl.textContent='加油加油~'; descEl.textContent='今天还没开始哦'; emojiEl.textContent='🌷'; }
      else if (pct<1) { textEl.textContent='继续努力~'; descEl.textContent='还差'+(total-doneCount)+'个就完成啦'; emojiEl.textContent='🌺'; }
      else { textEl.textContent='太棒啦~'; descEl.textContent='今日全部完成！'; emojiEl.textContent='🎉'; }
    }
  }

  function toggleDailyItem(catId, itemId) {
    const records=store.dailyRecords[catId]||(store.dailyRecords[catId]={}); const today=todayStr();
    if (!records[today]) records[today]={};
    records[today][itemId]=!records[today][itemId]; save();
    const cat=store.categories.find(c=>c.id===catId); renderDailyList(cat);
    toast(records[today][itemId]?'打卡成功~ ♡':'已取消打卡');
  }
  function deleteDailyItem(catId, itemId) {
    const cat=store.categories.find(c=>c.id===catId); if(!cat||!cat.items)return;
    cat.items=cat.items.filter(i=>i.id!==itemId);
    const records=store.dailyRecords[catId];
    if (records) Object.keys(records).forEach(function(date){ if(records[date][itemId]) delete records[date][itemId]; });
    save(); renderDailyList(cat); toast('已删除~');
  }
  function addDailyItem(catId) {
    const cat=store.categories.find(c=>c.id===catId); if(!cat)return;
    showModal('添加打卡项目','给新项目起个可爱的名字吧','例如：喝水、早睡、运动...',function(name){
      if(!cat.items)cat.items=[];
      cat.items.push({id:uid(),name:name}); save(); renderDailyList(cat); toast('添加成功~ ♡');
    });
  }

  let calCurrent=new Date(); let calSelectedDate=null;
  function renderCalendar() {
    const year=calCurrent.getFullYear(); const month=calCurrent.getMonth();
    document.getElementById('monthTitle').textContent=year+'年'+(month+1)+'月';
    const grid=document.getElementById('calGrid'); grid.innerHTML='';
    const firstDay=new Date(year,month,1); const lastDay=new Date(year,month+1,0);
    const startWeekday=firstDay.getDay(); const daysInMonth=lastDay.getDate(); const prevLastDay=new Date(year,month,0).getDate(); const today=todayStr();
    for (let i=startWeekday-1;i>=0;i--) {
      const d=prevLastDay-i; const cell=document.createElement('div'); cell.className='cal-day other-month'; cell.textContent=d; grid.appendChild(cell);
    }
    for (let d=1;d<=daysInMonth;d++) {
      const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const cell=document.createElement('div'); cell.className='cal-day'; cell.dataset.date=dateStr;
      if (dateStr===today) cell.classList.add('today');
      if (store.occasionalRecords[dateStr]) cell.classList.add('checked');
      if (dateStr===calSelectedDate) cell.classList.add('selected');
      cell.textContent=d; cell.addEventListener('click', function(){ selectCalDate(dateStr); }); grid.appendChild(cell);
    }
    const totalCells=startWeekday+daysInMonth; const remain=(7-(totalCells%7))%7;
    for (let d=1;d<=remain;d++) { const cell=document.createElement('div'); cell.className='cal-day other-month'; cell.textContent=d; grid.appendChild(cell); }
    updateCalStats(); updateCalActionBar();
  }
  function updateCalStats() {
    const year=calCurrent.getFullYear(); const month=calCurrent.getMonth(); let count=0; const dates=[];
    Object.keys(store.occasionalRecords).forEach(function(dateStr){
      if (store.occasionalRecords[dateStr]) { const parts=dateStr.split('-').map(Number); if(parts[0]===year&&parts[1]===month+1){count++;dates.push(dateStr);} }
    });
    document.getElementById('monthCount').textContent=count;
    dates.sort(); let interval=0;
    if (dates.length>=2) { const last=dates[dates.length-1]; const prev=dates[dates.length-2]; interval=Math.round((new Date(last)-new Date(prev))/86400000); }
    document.getElementById('intervalDays').textContent=interval;
  }
  function selectCalDate(dateStr) { calSelectedDate=dateStr; renderCalendar(); }
  function updateCalActionBar() {
    const bar=document.getElementById('calActionBar'); if(!calSelectedDate){bar.style.display='none';return;}
    bar.style.display='flex';
    const parts=calSelectedDate.split('-').map(Number); const dateObj=new Date(parts[0],parts[1]-1,parts[2]);
    const weekDays=['日','一','二','三','四','五','六'];
    document.getElementById('selDateText').textContent=parts[1]+'月'+parts[2]+'日 周'+weekDays[dateObj.getDay()];
    const checked=!!store.occasionalRecords[calSelectedDate];
    document.getElementById('selDateStatus').textContent=checked?'✓ 已打卡':'今日未打卡';
    document.getElementById('calCheckBtn').style.display=checked?'none':'flex';
    document.getElementById('calUncheckBtn').style.display=checked?'flex':'none';
  }
  document.getElementById('calCheckBtn').addEventListener('click', function(){ if(!calSelectedDate)return; store.occasionalRecords[calSelectedDate]=true; save(); renderCalendar(); toast('打卡成功~ ♡'); });
  document.getElementById('calUncheckBtn').addEventListener('click', function(){ if(!calSelectedDate)return; delete store.occasionalRecords[calSelectedDate]; save(); renderCalendar(); toast('已取消打卡'); });
  document.getElementById('prevMonth').addEventListener('click', function(){ calCurrent.setMonth(calCurrent.getMonth()-1); renderCalendar(); });
  document.getElementById('nextMonth').addEventListener('click', function(){ calCurrent.setMonth(calCurrent.getMonth()+1); renderCalendar(); });

  document.getElementById('navAddBtn').addEventListener('click', function(){
    showModal('添加打卡分类','新建一个打卡主题吧','例如：学习、健身、阅读...',function(name){
      const iconKey=ICON_KEYS[Math.floor(Math.random()*ICON_KEYS.length)];
      const newCat={id:uid(),name:name,icon:iconKey,type:'daily',items:[]};
      store.categories.push(newCat); store.navOrder.push(newCat.id); store.dailyRecords[newCat.id]={};
      save(); renderNav(); switchToCategory(newCat.id); toast('分类已添加~ ♡');
    });
  });
  document.getElementById('navEditToggle').addEventListener('click', function(){
    isEditing=!isEditing; document.getElementById('navEditToggle').classList.toggle('active',isEditing);
    renderNav(); toast(isEditing?'编辑模式：可拖拽排序，长按删除':'已完成编辑');
  });
  function renameCategory(id) {
    const cat=store.categories.find(c=>c.id===id); if(!cat)return;
    showModal('重命名分类','修改分类名称','',function(name){ cat.name=name; save(); renderNav(); renderPage(cat); toast('已重命名~'); }, cat.name);
  }
  function deleteCategory(id) {
    store.categories=store.categories.filter(c=>c.id!==id); store.navOrder=store.navOrder.filter(x=>x!==id); delete store.dailyRecords[id];
    save();
    if (activeCategoryId===id) activeCategoryId=store.categories[0]?store.categories[0].id:null;
    renderNav();
    if (activeCategoryId) { const cat=store.categories.find(c=>c.id===activeCategoryId); if(cat) renderPage(cat); }
    toast('已删除~');
  }
  document.getElementById('fabAdd').addEventListener('click', function(){ const cat=getActiveCategory(); if(cat&&cat.type==='daily') addDailyItem(cat.id); });

  function updateTime() { const d=new Date(); document.getElementById('statusTime').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

  // 初始化
  load(); renderNav();
  const firstCat=store.categories.find(c=>c.type==='daily')||store.categories[0];
  if (firstCat) switchToCategory(firstCat.id);
  updateTime(); updateSyncStatus(); setInterval(updateTime, 30000);
  window.addEventListener('online', updateSyncStatus);
  window.addEventListener('offline', updateSyncStatus);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ updateTime(); updateSyncStatus(); } });

  // 防止双击缩放
  let lastTouch=0;
  document.addEventListener('touchend', function(e){ const now=Date.now(); if(now-lastTouch<300) e.preventDefault(); lastTouch=now; }, {passive:false});

  // PWA Service Worker 注册
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').then(function(reg){
        console.log('SW注册成功', reg.scope);
      }).catch(function(err){ console.warn('SW注册失败', err); });
    });
  }
})();
</script>
</body>
</html>
